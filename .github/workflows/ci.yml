name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          pip install ruff==0.11.8 mypy==1.15.0 -r api/requirements.txt -r indexer/requirements.txt

      - name: Run Ruff Linter
        run: ruff check api indexer eval corpus

      - name: Run Mypy Type Checker
        run: |
          cd api && mypy app
          cd ../indexer && mypy pipeline

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt pytest-cov==6.0.0

      - name: Run Pytest with Coverage Gate
        env:
          RETRIEVER: stub
          LLM_PROVIDER: stub
        run: |
          cd api && pytest -q --cov=app --cov-fail-under=60
          cd ../indexer && pytest -q

  manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kustomize and Kubeconform
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate with Kubeconform
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas

  build:
    name: Build Images (No Push)
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          tags: adnan3974/rahbar-api:${{ github.sha }}

      - name: Build Indexer Image
        uses: docker/build-push-action@v6
        with:
          context: indexer
          push: false
          tags: adnan3974/rahbar-indexer:${{ github.sha }}

      - name: Build UI Image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: false
          tags: adnan3974/rahbar-ui:${{ github.sha }}

  scan:
    name: Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Images for Scanning
        run: |
          docker build -t rahbar-api:${{ github.sha }} api
          docker build -t rahbar-indexer:${{ github.sha }} indexer
          docker build -t rahbar-ui:${{ github.sha }} ui

      - name: Scan API Image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: rahbar-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan Indexer Image with Trivy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: rahbar-indexer:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  e2e-eval:
    name: End-to-End Evaluation Gate
    runs-on: ubuntu-latest
    needs: [test, manifests, build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r api/requirements.txt -r indexer/requirements.txt

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl rollout status deployment/redis -n rahbar --timeout=120s || true

      - name: Run Indexer Job on Fixtures
        run: |
          kubectl apply -f k8s/base/indexer-job.yaml
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=120s || true

      - name: Run Eval Gate against Fixtures
        run: |
          python eval/run_eval.py --api http://127.0.0.1:8000 --golden eval/fixtures/golden.fixture.yaml || true
